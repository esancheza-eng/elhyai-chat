<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icono-elhyai-chat.png">
<title>ElhyAi Chat — Conversaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f1a;
  --panel: #13162a;
  --surface: #1a1e35;
  --surface2: #20244a;
  --border: #252a45;
  --accent: #6c63ff;
  --accent2: #00d4aa;
  --accent3: #ff6b6b;
  --warn: #ffd166;
  --text: #e8eaf6;
  --muted: #6b7299;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.topbar { height:56px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px; position:sticky; top:0; z-index:10; }
.logo { font-family:'Syne',sans-serif; font-weight:800; font-size:18px; color:var(--accent); }
.logo span { color:var(--accent2); }
.nav-link { font-size:12px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:8px; border:1px solid var(--border); transition:all 0.2s; }
.nav-link:hover { color:var(--text); border-color:var(--accent); }
.back-link { margin-left:auto; }

.config-bar { display:flex; align-items:center; gap:10px; padding:10px 24px; background:var(--panel); border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
.config-bar input { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--text); font-size:12px; width:280px; font-family:'JetBrains Mono',monospace; }
.config-bar button { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--text); font-size:12px; cursor:pointer; }
.config-bar button:hover { border-color:var(--accent); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
.dot.ok { background:var(--accent2); }
.dot.err { background:var(--accent3); }

.inbox { display:grid; grid-template-columns:340px 1fr; height:calc(100vh - 104px); }

/* LISTA DE CONVERSACIONES */
.conv-list { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; }
.conv-item { padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; flex-direction:column; gap:4px; transition:background 0.15s; }
.conv-item:hover { background:var(--surface); }
.conv-item.active { background:var(--surface2); border-left:3px solid var(--accent); }
.conv-top { display:flex; justify-content:space-between; align-items:center; }
.conv-name { font-weight:600; font-size:14px; }
.conv-phone { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
.conv-preview { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-time { font-size:10px; color:var(--muted); }
.unread-badge { background:var(--accent2); color:#0d0f1a; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }
.empty-state { padding:40px 20px; text-align:center; color:var(--muted); font-size:13px; }

/* HILO DE MENSAJES */
.thread { display:flex; flex-direction:column; background:var(--bg); }
.thread-header { padding:16px 24px; background:var(--panel); border-bottom:1px solid var(--border); }
.thread-header h3 { font-family:'Syne',sans-serif; font-size:15px; }
.thread-header .sub { font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
.thread-body { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:60%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.4; }
.msg.entrante { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.saliente { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.msg-time { font-size:9px; color:var(--muted); margin-top:4px; display:block; }
.msg.saliente .msg-time { color:rgba(255,255,255,0.7); }
.thread { min-height:0; }
.composer { border-top:1px solid var(--border); background:var(--panel); padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
.window-note { font-size:11px; padding:6px 10px; border-radius:8px; }
.window-note.open { color:var(--accent2); background:rgba(0,212,170,0.08); }
.window-note.closed { color:var(--warn); background:rgba(255,209,102,0.08); }
.composer-row { display:flex; gap:10px; align-items:flex-end; }
.composer textarea { flex:1; resize:none; min-height:44px; max-height:140px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
.composer textarea:focus { border-color:var(--accent); }
.composer button { background:var(--accent); color:#fff; border:none; border-radius:12px; padding:12px 20px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
.composer button:disabled { opacity:0.5; cursor:not-allowed; }
.send-error { font-size:12px; color:var(--accent3); display:none; }
.msg { white-space:pre-wrap; word-wrap:break-word; }
.attn-badge { background:var(--warn); color:#0d0f1a; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }
.badges { display:flex; gap:6px; }
.thread-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.bot-toggle { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:8px 14px; font-size:12px; cursor:pointer; white-space:nowrap; }
.bot-toggle.on { border-color:var(--accent2); }
.bot-toggle.off { border-color:var(--warn); }
.bot-toggle:disabled { opacity:0.5; cursor:wait; }
.thread-placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; flex-direction:column; gap:8px; }
/* Ficha del cliente (datos de la base de cobranza) */
.ficha { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px 18px; padding:12px 24px; background:var(--surface2, #161a2e); border-bottom:1px solid var(--border); }
.ficha:empty { display:none; }
.ficha .f { min-width:0; }
.ficha .l { font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.ficha .v { font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ficha .v.mono { font-family:'JetBrains Mono',monospace; }
.cal { display:inline-block; padding:1px 7px; border-radius:6px; font-weight:700; font-size:11px; margin-right:6px; background:#2a2f45; color:#c9cde0; }
.cal-AA { background:#0f3d2e; color:#3ee6a8; } .cal-A { background:#173a4a; color:#5cc8ff; }
.cal-B { background:#4a3b12; color:#ffd166; } .cal-C { background:#4a2a12; color:#ff9f66; }
.cal-D, .cal-E { background:#4a1220; color:#ff6b81; }
.btn-copy { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; margin-left:6px; }
@media (max-width:900px) { .ficha { grid-template-columns:repeat(2, minmax(0,1fr)); } }

/* ═════ Tema claro "hueso" (reemplaza al fondo oscuro) ═════ */
:root {
  --bg:#f5f2eb; --panel:#fffdf9; --surface:#ffffff; --surface2:#f1ece2; --border:#e2dbcd;
  --accent:#1f4e8c; --accent2:#0f7a5c; --accent3:#c0392b; --bad:#c0392b; --warn:#b26b00;
  --text:#1d2330; --text2:#475063; --muted:#707789;
}
body, body *:not(.logo) { font-family:'Inter', 'Segoe UI', Arial, sans-serif !important; }
body { font-variant-numeric: tabular-nums; -webkit-font-smoothing:antialiased; }
.logo { color:var(--accent) !important; }
.logo span { color:var(--accent2) !important; }
h1, h2, h3, h4, .title, .stat-val, .tile .val, .progress-pct { letter-spacing:-0.01em; font-weight:700 !important; }
.topbar, .config-bar, .config { box-shadow:0 1px 0 var(--border); }
.card, .side-card, .tile, .conv-list, .thread-header, .ficha { box-shadow:0 1px 2px rgba(30,35,48,.04); }
input, select, textarea { color:var(--text) !important; }
::placeholder { color:#a3a8b5 !important; }
.unread-badge { color:#fff !important; }
.unread-badge[style] { color:var(--text) !important; font-weight:600; }
.attn-badge { background:#fdecc8 !important; color:#8a5300 !important; }
.msg.entrante { background:#ffffff !important; border:1px solid var(--border) !important; color:var(--text) !important; }
.msg.saliente { background:#1f4e8c !important; }
.window-note.open { background:#e6f4ee !important; color:#0f6a50 !important; }
.window-note.closed { background:#fdf3e1 !important; color:#8a5300 !important; }
.cal { background:#eceae4 !important; color:#4a5060 !important; }
.cal-AA { background:#dcf3e8 !important; color:#0b6b4c !important; }
.cal-A { background:#dfeefb !important; color:#1c5a96 !important; }
.cal-B { background:#fdf0cf !important; color:#8a5a00 !important; }
.cal-C { background:#fde4d0 !important; color:#a8470f !important; }
.cal-D, .cal-E { background:#fbdde0 !important; color:#a61b2b !important; }
.rod-baja { color:#c2410c !important; } .rod-sube { color:#0f7a5c !important; }
.toast { background:#1d2330 !important; color:#fff !important; }
.badge-live { background:#dcf3e8 !important; color:#0b6b4c !important; }
.badge-off { background:#fbdde0 !important; color:#a61b2b !important; }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="index.html" title="Menú" style="display:flex;align-items:center;text-decoration:none"><img src="img/logo-elhyai-chat.png" alt="ElhyAi Chat" style="height:46px;width:auto;display:block"></a>
  <a class="nav-link" href="campanas-masivas.html">Campañas Masivas</a>
  <a class="nav-link back-link" href="index.html">← Menú</a>
</div>

<div class="config-bar">
  <span>Backend:</span>
  <input type="text" id="backendUrl" value="https://elhyai-chat.onrender.com">
  <span>Clave:</span>
  <input type="password" id="apiKey" placeholder="API_KEY" autocomplete="off" style="width:160px" onchange="guardarApiKey()">
  <button onclick="verificarConexion()">Verificar</button>
  <span><span class="dot" id="statusDot"></span> <span id="statusText">sin verificar</span></span>
  <button id="btnSonido" onclick="cambiarSonido()" title="Sonido al llegar mensajes nuevos" style="margin-left:auto">🔔 Sonido: sí</button>
</div>

<div class="inbox">
  <div class="conv-list" id="convList">
    <div class="empty-state">Cargando conversaciones…</div>
  </div>

  <div class="thread" id="thread">
    <div class="thread-placeholder">
      <div style="font-size:32px">💬</div>
      <div>Selecciona una conversación para ver los mensajes</div>
    </div>
  </div>
</div>

<script>
let backendUrl = document.getElementById('backendUrl').value.replace(/\/$/, '');
let conversacionActiva = null;
let pollInterval = null;

// ── Clave de acceso al backend ─────────────────────────
// Se guarda solo en este navegador (localStorage) y se envía
// en el header x-api-key en cada llamada a /api/*.
const API_KEY_STORAGE = 'elhyai_api_key';
function getApiKey() {
  const el = document.getElementById('apiKey');
  return el ? el.value.trim() : '';
}
function guardarApiKey() {
  try { localStorage.setItem(API_KEY_STORAGE, getApiKey()); } catch (e) {}
}
(function cargarApiKey() {
  try {
    const k = localStorage.getItem(API_KEY_STORAGE);
    if (k) document.getElementById('apiKey').value = k;
  } catch (e) {}
})();
function apiFetch(url, options = {}) {
  const headers = Object.assign({}, options.headers || {}, { 'x-api-key': getApiKey() });
  return fetch(url, Object.assign({}, options, { headers })).then(res => {
    if (res.status === 401) mostrarErrorClave();
    return res;
  });
}
function mostrarErrorClave() {
  document.getElementById('statusDot').className = 'dot err';
  document.getElementById('statusText').textContent = 'clave incorrecta';
}

// Escapa texto antes de insertarlo en la página (evita que un mensaje
// de cliente con HTML o scripts se ejecute dentro del panel).
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Datos de cada conversación (para saber la ventana de 24h)
let conversacionesPorTelefono = {};
const VENTANA_MS = 24 * 60 * 60 * 1000;

function fmtFecha(fechaISO) {
  if (!fechaISO) return '';
  const d = new Date(fechaISO);
  return d.toLocaleString('es-EC', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

// Estado de la conexión durante las revisiones automáticas (cada 5 s)
let conexionCaida = false;
function marcarConexion(ok) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (ok) {
    if (conexionCaida) { dot.className = 'dot ok'; text.textContent = 'conectado'; }
    conexionCaida = false;
  } else if (!conexionCaida) {
    conexionCaida = true;
    dot.className = 'dot';
    text.textContent = 'reconectando…';
  }
}

async function verificarConexion() {
  backendUrl = document.getElementById('backendUrl').value.replace(/\/$/, '');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  text.textContent = 'verificando...';
  dot.className = 'dot';
  try {
    guardarApiKey();
    const res = await apiFetch(`${backendUrl}/api/ping`);
    if (res.status === 401) return;
    if (res.ok) {
      dot.className = 'dot ok';
      text.textContent = 'conectado';
    } else {
      throw new Error('sin respuesta');
    }
  } catch (e) {
    dot.className = 'dot err';
    text.textContent = 'sin conexión';
  }
}

// ── Ahorro de lecturas ──
// La revisión automática pide solo las conversaciones que cambiaron
// (modo 'cambios'). Cada 10 minutos, y en cualquier acción tuya
// (abrir chat, responder, bot), se carga la lista completa como siempre.
let cursorConv = null;          // fecha del último cambio recibido
// Si el servidor no responde en 20 s se cancela la petición (internet colgado)
function limiteTiempo() {
  try { return AbortSignal.timeout(20000); } catch (e) { return undefined; }
}
let ultimaCargaCompleta = 0;    // cuándo fue la última lista completa
const COMPLETA_CADA_MS = 10 * 60 * 1000;

async function cargarConversaciones(modo) {
  try {
    const parcial = modo === 'cambios' && cursorConv
      && Object.keys(conversacionesPorTelefono).length > 0
      && (Date.now() - ultimaCargaCompleta) < COMPLETA_CADA_MS;
    const url = parcial
      ? `${backendUrl}/api/conversations?desde=${encodeURIComponent(cursorConv)}`
      : `${backendUrl}/api/conversations`;
    const res = await apiFetch(url, { signal: limiteTiempo() });
    if (res.status === 401) { // clave incorrecta: se avisa arriba y la lista no se borra
      const l = document.getElementById('convList');
      if (!l.querySelector('.conv-item')) l.innerHTML = '<div class="empty-state">Clave incorrecta o vacía.<br><br>Escríbela en el campo <b>Clave</b> de arriba y pulsa <b>Verificar</b>.</div>';
      return;
    }
    let data = null;
    try { data = await res.json(); } catch (_) {}
    // Error del servidor: no borrar la lista; se guarda el detalle para mostrarlo
    if (!res.ok || !data || !data.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    const list = document.getElementById('convList');
    marcarConexion(true);
    if (data.cursor) cursorConv = data.cursor;

    if (parcial) {
      // Juntar los cambios con la lista que ya está en pantalla
      const cambios = (data.conversaciones || []).filter(c =>
        JSON.stringify(c) !== JSON.stringify(conversacionesPorTelefono[c.telefono]));
      if (!cambios.length) { // nada nuevo: no se redibuja
        if (conversacionActiva) { actualizarVentana(); actualizarBotonBot(); }
        return;
      }
      const mapa = Object.assign({}, conversacionesPorTelefono);
      cambios.forEach(c => { mapa[c.telefono] = c; });
      data.conversaciones = Object.values(mapa).sort((a, b) =>
        (Date.parse(b.ultimaActualizacion) || 0) - (Date.parse(a.ultimaActualizacion) || 0));
    } else {
      ultimaCargaCompleta = Date.now();
    }

    if (!data.ok || !data.conversaciones || data.conversaciones.length === 0) {
      list.innerHTML = '<div class="empty-state">Todavía no hay respuestas de clientes.<br><br>En cuanto un cliente conteste un mensaje, aparecerá aquí automáticamente.</div>';
      return;
    }

    avisarMensajesNuevos(data.conversaciones);
    conversacionesPorTelefono = {};
    data.conversaciones.forEach(c => { conversacionesPorTelefono[c.telefono] = c; });

    list.innerHTML = data.conversaciones.map(c => `
      <div class="conv-item ${conversacionActiva === c.telefono ? 'active' : ''}" data-tel="${esc(c.telefono)}">
        <div class="conv-top">
          <span class="conv-name">${esc(c.nombre || c.telefono)}</span>
          <span class="badges">
            ${c.etiquetaCobranza ? `<span class="unread-badge" style="background:var(--surface2);color:var(--text);border:1px solid var(--border)">${esc(c.etiquetaCobranza)}</span>` : ''}
            ${c.requiereAtencion ? '<span class="attn-badge">atender</span>' : ''}
            ${c.noLeido && conversacionActiva !== c.telefono ? '<span class="unread-badge">nuevo</span>' : ''}
          </span>
        </div>
        <span class="conv-phone">${esc(c.telefono)}</span>
        <span class="conv-preview">${esc(c.ultimoMensaje || '')}</span>
      </div>
    `).join('');

    if (conversacionActiva) { actualizarVentana(); actualizarBotonBot(); }
  } catch (e) {
    // Si ya había conversaciones en pantalla, se quedan como estaban
    // y solo se avisa "reconectando…" (internet débil o servidor despertando).
    const list = document.getElementById('convList');
    if (list.querySelector('.conv-item')) {
      marcarConexion(false);
    } else {
      const detalle = String((e && e.message) || '');
      const esRed = /Failed to fetch|NetworkError|Load failed/i.test(detalle);
      list.innerHTML = esRed
        ? '<div class="empty-state">No se pudo conectar al backend. Verifica la URL y la clave arriba.<br><br>Si el servidor estaba dormido, espera un minuto: se reintenta solo.</div>'
        : '<div class="empty-state">El servidor respondió con un error al leer las conversaciones.<br><br><span style="font-size:11px;word-break:break-word">Detalle: ' + esc(detalle) + '</span></div>';
    }
  }
}

// Clic en una conversación de la lista
document.getElementById('convList').addEventListener('click', e => {
  const item = e.target.closest('.conv-item');
  if (!item) return;
  const tel = item.dataset.tel;
  const c = conversacionesPorTelefono[tel] || {};
  abrirConversacion(tel, c.nombre || tel);
});

async function abrirConversacion(telefono, nombre) {
  conversacionActiva = telefono;

  const thread = document.getElementById('thread');
  thread.innerHTML = `
    <div class="thread-header">
      <div>
        <h3>${esc(nombre)}</h3>
        <div class="sub">${esc(telefono)}</div>
      </div>
      <button class="bot-toggle" id="botToggle" onclick="cambiarBot()">…</button>
    </div>
    <div class="ficha" id="ficha"></div>
    <div class="thread-body" id="threadBody">Cargando mensajes…</div>
    <div class="composer">
      <div class="window-note" id="windowNote"></div>
      <div class="composer-row">
        <textarea id="replyText" rows="1" placeholder="Escribe tu respuesta… (Enter envía, Shift+Enter salto de línea)"></textarea>
        <button id="btnSend" onclick="enviarRespuesta()">Enviar</button>
      </div>
      <div class="send-error" id="sendError"></div>
    </div>
  `;

  const ta = document.getElementById('replyText');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarRespuesta();
    }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  });

  actualizarVentana();
  actualizarBotonBot();
  apiFetch(`${backendUrl}/api/conversations/${encodeURIComponent(telefono)}/leido`, { method: 'POST' })
    .then(() => cargarConversaciones())
    .catch(() => {});

  await cargarHilo(telefono);
  ta.focus();
}

// Muestra si la ventana de 24h de WhatsApp está abierta o cerrada
function actualizarVentana() {
  const note = document.getElementById('windowNote');
  if (!note || !conversacionActiva) return;
  const c = conversacionesPorTelefono[conversacionActiva] || {};
  const ult = c.ultimoEntrante ? new Date(c.ultimoEntrante).getTime() : null;
  if (ult && Date.now() - ult < VENTANA_MS) {
    const restanH = Math.max(0, Math.floor((VENTANA_MS - (Date.now() - ult)) / 3600000));
    note.className = 'window-note open';
    note.textContent = `Ventana abierta: puedes responder libremente (quedan ~${restanH} h).`;
  } else if (ult) {
    note.className = 'window-note closed';
    note.textContent = 'Pasaron más de 24 h desde el último mensaje del cliente: WhatsApp rechazará el texto libre (solo plantillas).';
  } else {
    note.className = 'window-note closed';
    note.textContent = 'Sin registro de la hora del último mensaje del cliente; si pasaron más de 24 h, WhatsApp rechazará el envío.';
  }
}

// Estado del bot en la conversación abierta
function botActivo(c) {
  return !(c && c.botPausadoHasta && new Date(c.botPausadoHasta).getTime() > Date.now());
}
function actualizarBotonBot() {
  const btn = document.getElementById('botToggle');
  if (!btn || !conversacionActiva) return;
  const c = conversacionesPorTelefono[conversacionActiva] || {};
  if (botActivo(c)) {
    btn.className = 'bot-toggle on';
    btn.textContent = '🤖 Bot respondiendo · Atender yo';
    btn.title = 'Pausa el bot 12 horas en esta conversación';
  } else {
    const hasta = new Date(c.botPausadoHasta);
    btn.className = 'bot-toggle off';
    btn.textContent = '🙋 Atiendes tú · Reactivar bot';
    btn.title = 'Bot en pausa hasta ' + hasta.toLocaleString('es-EC', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }
}
async function cambiarBot() {
  const btn = document.getElementById('botToggle');
  if (!btn || !conversacionActiva) return;
  const c = conversacionesPorTelefono[conversacionActiva] || {};
  const activar = !botActivo(c);
  btn.disabled = true;
  try {
    const res = await apiFetch(`${backendUrl}/api/conversations/${encodeURIComponent(conversacionActiva)}/bot`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activo: activar })
    });
    if (!res.ok) throw new Error('Error ' + res.status);
    await cargarConversaciones();
  } catch (e) {
    alert('No se pudo cambiar el estado del bot: ' + e.message);
  } finally {
    btn.disabled = false;
    actualizarBotonBot();
  }
}

async function enviarRespuesta() {
  const ta = document.getElementById('replyText');
  const btn = document.getElementById('btnSend');
  const errBox = document.getElementById('sendError');
  if (!ta || !conversacionActiva) return;
  const texto = ta.value.trim();
  if (!texto) return;

  btn.disabled = true;
  btn.textContent = 'Enviando…';
  errBox.style.display = 'none';
  try {
    const res = await apiFetch(`${backendUrl}/api/conversations/${encodeURIComponent(conversacionActiva)}/responder`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || `Error ${res.status}`);
    ta.value = '';
    ta.style.height = 'auto';
    await cargarHilo(conversacionActiva);
    cargarConversaciones();
  } catch (e) {
    errBox.textContent = 'No se envió: ' + e.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar';
    ta.focus();
  }
}

// ── Fotos, audios y documentos enviados por el cliente ──
const mediaCache = {};
function htmlMedia(m) {
  if (!m.mediaId) return '';
  const id = esc(m.mediaId);
  if (m.mediaTipo === 'image') return `<img class="msg-media" data-media="${id}" alt="Imagen" title="Clic para ampliar" style="display:block;max-width:260px;max-height:320px;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#222;min-height:60px" onclick="abrirMedia('${id}')">`;
  if (m.mediaTipo === 'audio') return `<audio controls data-media="${id}" style="display:block;max-width:260px;margin-bottom:6px"></audio>`;
  if (m.mediaTipo === 'video') return `<video controls data-media="${id}" style="display:block;max-width:260px;border-radius:8px;margin-bottom:6px"></video>`;
  return `<button type="button" onclick="abrirMedia('${id}')" style="display:block;margin-bottom:6px;padding:6px 10px;border-radius:6px;border:0;cursor:pointer">📎 Abrir ${esc(m.mediaNombre || 'archivo')}</button>`;
}
async function obtenerMedia(id) {
  if (mediaCache[id]) return mediaCache[id];
  const res = await apiFetch(`${backendUrl}/api/media/${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error('no disponible');
  mediaCache[id] = URL.createObjectURL(await res.blob());
  return mediaCache[id];
}
function cargarMedias(cont) {
  cont.querySelectorAll('[data-media]').forEach(el => {
    obtenerMedia(el.dataset.media).then(url => {
      el.onload = () => { if (cont.scrollHeight - cont.scrollTop - cont.clientHeight < 400) cont.scrollTop = cont.scrollHeight; };
      el.src = url;
    })
      .catch(() => { el.replaceWith(Object.assign(document.createElement('div'), { textContent: '(archivo no disponible)', style: 'font-size:12px;opacity:.7' })); });
  });
}
async function abrirMedia(id) {
  try { window.open(await obtenerMedia(id), '_blank'); }
  catch (e) { alert('Este archivo ya no está disponible en WhatsApp.'); }
}

// ── Cédula y datos del cliente (de la base de la campaña) ──
function mostrarDatosCliente(cl) {
  const box = document.getElementById('ficha');
  if (!box) return;
  let html = '';
  if (cl) {
    const campo = (l, v, ancho) => `<div class="f"${ancho ? ` style="grid-column:span ${ancho}"` : ''}><div class="l">${l}</div><div class="v">${v || '<span style="color:var(--muted)">—</span>'}</div></div>`;
    const cal = (c) => c ? `<span class="cal cal-${String(c).toUpperCase().startsWith('AA') ? 'AA' : esc(String(c).charAt(0).toUpperCase())}">${esc(c)}</span>` : ''; // E1, E2… usan el color de su letra
    const r = String(cl.rodamiento || '').toLowerCase();
    const rod = !cl.rodamiento ? '' : r.startsWith('deterior') ? `<span class="rod-baja" style="color:#ff9f66;font-weight:600;font-size:11.5px">▼ ${esc(cl.rodamiento)}</span>`
      : r.startsWith('mejor') ? `<span class="rod-sube" style="color:#3ee6a8;font-weight:600;font-size:11.5px">▲ ${esc(cl.rodamiento)}</span>`
      : `<span style="color:var(--muted);font-size:11.5px">${esc(cl.rodamiento)}</span>`;
    const ced = cl.cedula ? `<span class="mono"><b>${esc(cl.cedula)}</b></span><button type="button" class="btn-copy" onclick="copiarCedula('${esc(cl.cedula)}', this)">Copiar</button>` : '';
    const vencido = cl.deuda ? `<b>$${Number(cl.deuda).toFixed(2)}</b>${cl.mes ? ' · ' + esc(cl.mes) : ''}${cl.dias ? ' · ' + esc(cl.dias) + ' días' : ''}` : '';
    const total = cl.saldoTotal ? `<b>$${Number(cl.saldoTotal).toLocaleString('es-EC', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b>` : '';
    // 3 filas de 4 columnas: identificación · calificación y saldos · responsables
    html = campo('Cliente', esc(cl.nombre), 2)
      + campo('Cédula', ced)
      + campo('Tienda factura', esc(cl.tienda))
      + campo('Calificación mensual', cal(cl.calMensual))
      + campo('Calificación rodamiento', cal(cl.calRodamiento) + rod)
      + campo('Saldo vencido', vencido)
      + campo('Saldo total del crédito', total)
      + campo('Cobrador', esc(cl.cobrador), 2)
      + campo('Vendedor', esc(cl.vendedor), 2);
  }
  if (box.dataset.html !== html) { box.dataset.html = html; box.innerHTML = html; }
}
function copiarCedula(ced, btn) {
  const listo = () => { btn.textContent = '✓ Copiada'; setTimeout(() => btn.textContent = 'Copiar', 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(ced).then(listo).catch(() => prompt('Cédula:', ced));
  else prompt('Cédula:', ced);
}

// ── Sonido cuando llegan mensajes nuevos de clientes ──
let sonidoActivo = true;
try { sonidoActivo = localStorage.getItem('elhyai_sonido') !== 'no'; } catch (e) {}
let audioCtx = null;
let ultimoEntranteVisto = null; // null = primera carga (no suena)
function pintarBotonSonido() {
  const b = document.getElementById('btnSonido');
  if (b) b.textContent = sonidoActivo ? '🔔 Sonido: sí' : '🔕 Sonido: no';
}
function cambiarSonido() {
  sonidoActivo = !sonidoActivo;
  try { localStorage.setItem('elhyai_sonido', sonidoActivo ? 'si' : 'no'); } catch (e) {}
  pintarBotonSonido();
  if (sonidoActivo) sonar();
}
// El navegador solo permite sonido después de un clic en la página
document.addEventListener('click', () => {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
});
function sonar() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [[880, 0], [1320, 0.15]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.3);
    });
  } catch (e) {}
}
function avisarMensajesNuevos(lista) {
  let max = 0, nuevos = 0;
  lista.forEach(c => {
    const t = c.ultimoEntrante ? Date.parse(c.ultimoEntrante) : 0;
    if (t > max) max = t;
    if (ultimoEntranteVisto !== null && t > ultimoEntranteVisto) nuevos++;
  });
  if (ultimoEntranteVisto !== null && nuevos && sonidoActivo) sonar();
  if (max > (ultimoEntranteVisto || 0)) ultimoEntranteVisto = max;
  // Cantidad de chats sin leer en el título de la pestaña
  const sinLeer = lista.filter(c => c.noLeido && c.telefono !== conversacionActiva).length;
  document.title = (sinLeer ? `(${sinLeer}) ` : '') + 'ElhyAi Chat — Conversaciones';
}
pintarBotonSonido();

async function cargarHilo(telefono) {
  try {
    const res = await apiFetch(`${backendUrl}/api/conversations/${encodeURIComponent(telefono)}`, { signal: limiteTiempo() });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) return false; // error: se deja lo que está en pantalla y se reintenta
    const body = document.getElementById('threadBody');
    if (!body) return true;

    if (!data.mensajes || data.mensajes.length === 0) {
      body.innerHTML = '<div class="thread-placeholder">Sin mensajes todavía</div>';
      return true;
    }

    if (telefono !== conversacionActiva) return;
    mostrarDatosCliente(data.cliente);
    const estabaAbajo = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
    const html = data.mensajes.map(m => `
      <div class="msg ${m.direccion === 'saliente' ? 'saliente' : 'entrante'}">${htmlMedia(m)}${esc(m.texto)}<span class="msg-time">${m.origen === 'agente' ? 'Tú · ' : m.origen === 'bot' ? '🤖 Bot · ' : ''}${fmtFecha(m.fecha)}</span></div>
    `).join('');
    // Solo redibuja si hubo cambios (así no se corta un audio ni parpadean las fotos)
    if (body.dataset.html === html && body.dataset.cargado === telefono) return true;
    body.dataset.html = html;
    body.innerHTML = html;
    cargarMedias(body);
    if (estabaAbajo || body.dataset.cargado !== telefono) {
      body.scrollTop = body.scrollHeight;
      body.dataset.cargado = telefono;
    }
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

// Refresca la lista y la conversación abierta cada 5 segundos,
// para simular "tiempo real" sin necesidad de websockets.
// Ahorro: solo cambios cada 5 s (cada 30 s si la pestaña está oculta),
// y el chat abierto se relee solo cuando llegó o salió un mensaje.
let revisando = false;
let ultimaRevision = 0;
let hiloVersion = {}; // teléfono → ultimaActualizacion con la que se cargó su chat
function iniciarPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    if (revisando) return; // la revisión anterior aún no termina
    if (document.hidden && Date.now() - ultimaRevision < 30000) return;
    revisando = true;
    ultimaRevision = Date.now();
    try {
      await cargarConversaciones('cambios');
      if (conversacionActiva) {
        const c = conversacionesPorTelefono[conversacionActiva] || {};
        if (hiloVersion[conversacionActiva] !== c.ultimaActualizacion) {
          const tel = conversacionActiva, version = c.ultimaActualizacion;
          if (await cargarHilo(tel)) hiloVersion[tel] = version; // si falló, se reintenta en 5 s
        }
      }
    } finally {
      revisando = false;
    }
  }, 5000);
}

verificarConexion();
cargarConversaciones();
iniciarPolling();
</script>
